<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NxK Greetings — Make Someone's Day Special ✨</title>
    <meta
      name="description"
      content="Create a beautiful personalized greeting they will never forget. Cinematic digital surprises with hearts, particles, music and a unique shareable link — free forever, by NxK Developer."
    />
    <meta name="author" content="NxK Developer — Founder: Nishant Singh, Co-Founder: Khushi" />
    <meta name="theme-color" content="#0b0616" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://nxxk-greetings.web.app/" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NxK Greetings" />
    <meta property="og:title" content="NxK Greetings — Make Someone's Day Special ✨" />
    <meta
      property="og:description"
      content="A cinematic personalized greetings platform. Create a digital surprise with hearts, particles, music and a unique link — free forever."
    />
    <meta property="og:url" content="https://nxxk-greetings.web.app/" />
    <meta property="og:image" content="/icons/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NxK Greetings — Make Someone's Day Special ✨" />
    <meta
      name="twitter:description"
      content="Create a beautiful personalized greeting they will never forget. Free cinematic digital surprises by NxK Developer."
    />
    <meta name="twitter:image" content="/icons/og-image.png" />

    <meta
      name="robots"
      content="index, follow"
    />
  </head>
  <body>
    <div id="root">
      <!-- Static first-paint shell: replaced by React on hydration. Keeps first load from feeling blank. -->
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: radial-gradient(1200px 800px at 50% -10%, #1b1035 0%, #0b0616 55%, #050310 100%);
          color: #e9e3ff;
          font-family: ui-sans-serif, system-ui, sans-serif;
        "
      >
        <div
          style="
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.55);
            animation: nxxk-boot-pulse 1.6s ease-in-out infinite;
          "
        >
          NxK
        </div>
        <div style="font-size: 14px; opacity: 0.75; letter-spacing: 0.4px">
          Preparing something special…
        </div>
        <style>
          @keyframes nxxk-boot-pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; }
          }
          @media (prefers-reduced-motion: reduce) {
            [style*="nxxk-boot-pulse"] { animation: none !important; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
